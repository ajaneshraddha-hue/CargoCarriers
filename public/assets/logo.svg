<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <defs>
    <linearGradient id="sccOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="sccBlueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Left Emblem: SCC Globe & Fast Arc -->
  <g transform="translate(10, 10)">
    <!-- Orange top/left arc -->
    <path d="M 60,10 A 50,50 0 0,0 15,75" fill="none" stroke="url(#sccOrangeGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 75,14 A 50,50 0 0,1 110,55" fill="none" stroke="url(#sccOrangeGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Blue bottom/right arc -->
    <path d="M 60,110 A 50,50 0 0,0 105,45" fill="none" stroke="url(#sccBlueGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 45,106 A 50,50 0 0,1 15,65" fill="none" stroke="url(#sccBlueGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Inner SCC Text -->
    <text x="60" y="72" font-family="'Inter', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#0F284E" text-anchor="middle" letter-spacing="1">SCC</text>
  </g>

  <!-- Brand Typography -->
  <!-- "Sachin" with extended top bar & growth arrows -->
  <g transform="translate(145, 12)">
    <!-- Extended S top bar over Sachin -->
    <path d="M 4,28 L 185,28" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Sachin Text -->
    <text x="0" y="66" font-family="'Inter', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="900" fill="#1E293B" letter-spacing="1.5">Sachin</text>

    <!-- Upward Growth / Logistics Arrow Above 'in' -->
    <g transform="translate(195, 15)">
      <!-- Step bars -->
      <rect x="0" y="24" width="6" height="12" rx="2" fill="#F59E0B" />
      <rect x="9" y="16" width="6" height="20" rx="2" fill="#F59E0B" />
      <rect x="18" y="8" width="6" height="28" rx="2" fill="#EA580C" />
      <!-- Arrow pointing up-right -->
      <path d="M -2,22 L 12,14 L 24,6 L 36,-6" fill="none" stroke="#EA580C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 24,-6 L 36,-6 L 36,6" fill="none" stroke="#EA580C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Subtitle: Cargo Carriers -->
    <text x="0" y="104" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#0284C7" letter-spacing="1.2">Cargo Carriers</text>
  </g>
</svg>
